# -----------------------------------------------------------------------------
# Istio Ambient Mesh 적용
#   1) 네임스페이스 라벨만으로 L4 mTLS(ztunnel) 적용 - Pod 재시작 불필요
#   2) L7 정책(경로/헤더 기반 인가, 재시도 등)이 필요하면 waypoint 배포
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: shop-waypoint
    gateway-access: public
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-waypoint
  namespace: shop
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# 메시 전체 mTLS STRICT
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# 예: payment 서비스는 order 서비스만 호출 가능 (Zero Trust)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payment-allow-order
  namespace: shop
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: payment
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/order
---
# 외부 결제 PG(Stripe 등) 호출 허용 - 등록된 외부 호스트만 Egress 허용
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: stripe-api
  namespace: shop
spec:
  hosts:
    - api.stripe.com
  ports:
    - number: 443
      name: tls
      protocol: TLS
  resolution: DNS
  location: MESH_EXTERNAL
