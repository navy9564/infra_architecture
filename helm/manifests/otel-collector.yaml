# OpenTelemetry : Collector(Gateway 모드) + 자동계측
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: opentelemetry
spec:
  mode: deployment
  replicas: 2
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
      batch: {}
    exporters:
      otlphttp/prometheus:
        endpoint: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/otlp
      otlphttp/loki:
        endpoint: http://loki-gateway.logging.svc.cluster.local/otlp
      debug: {}
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]   # Tempo/Jaeger 도입 시 교체
---
# 네임스페이스/Pod 어노테이션으로 자동계측 주입
#   instrumentation.opentelemetry.io/inject-java: "opentelemetry/default"
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default
  namespace: opentelemetry
spec:
  exporter:
    endpoint: http://otel-collector.opentelemetry:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_traceidratio
    argument: "0.2"
