# External Secrets : AWS Secrets Manager(또는 OpenBao) -> Kubernetes Secret
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # 인증: external-secrets ServiceAccount 에 EKS Pod Identity 로 IAM Role 연결
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-db-credentials
  namespace: shop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: order-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: stdarch-dev/order-db
        property: username
    - secretKey: password
      remoteRef:
        key: stdarch-dev/order-db
        property: password
---
# On-Premise : OpenBao(Vault 호환) 백엔드 예시
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
