# Loki (SimpleScalable) : 로그 저장소. 운영은 오브젝트 스토리지(S3) 백엔드 필수
deploymentMode: SimpleScalable
loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: CHANGE-ME-loki-chunks
      ruler: CHANGE-ME-loki-ruler
      admin: CHANGE-ME-loki-admin
    s3:
      region: ap-northeast-2
  limits_config:
    retention_period: 720h
backend:
  replicas: 2
read:
  replicas: 2
write:
  replicas: 3
# 개발/검증용으로 S3 대신 MinIO 를 쓰려면 아래를 true 로
minio:
  enabled: false
