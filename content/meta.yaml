site:
  title: 표준 인프라 아키텍처 가이드
  subtitle: Production Microservices Reference Architecture · End-to-End (2026 Edition)
  version: v0.1.0
  updated: 2026-11-25
  repo: https://github.com/navy9564/infra_architecture
  owner: TA/SA Practice

intro: |
  인프라 환경(Legacy On-Premise / Private Cloud / Public Cloud)이 달라도 **아키텍처의 골격은 거의 같다**는 전제에서 출발합니다.
  이 가이드는 SI 프로젝트에서 반복적으로 그리는 "프로덕션 마이크로서비스 아키텍처"를 하나의 **표준 구성도**로 고정하고,
  각 구성요소별로 ① 역할 ② 2026년 기준 대표 솔루션(CNCF 성숙도 포함) ③ 권장 선택 ④ 설치 자동화(Terraform · Ansible · Helm)를 제공합니다.

principles:
  - title: 환경 독립적인 계층 구조
    desc: Edge → L4 → L7 Gateway → Mesh → Service → Data 의 6계층은 어디서나 동일. 바뀌는 것은 "구현체" 뿐입니다.
  - title: Kubernetes 를 공통 추상화 계층으로
    desc: EKS · AKS · GKE · kubeadm 어느 것이든 Helm 차트/매니페스트는 그대로 재사용합니다.
  - title: 표준 API 우선 (Gateway API · OpenTelemetry · OCI)
    desc: 벤더 고유 어노테이션 대신 표준 API를 사용해 교체 비용을 낮춥니다. (ingress-nginx 은퇴 사례가 교훈)
  - title: Everything as Code
    desc: 인프라(Terraform/OpenTofu) · 구성(Ansible) · 애플리케이션 플랫폼(Helm/GitOps)을 모두 Git 으로 관리합니다.
  - title: Zero Trust 기본값
    desc: 서비스 간 mTLS(ambient mesh), 최소권한 IAM(Pod Identity), 정책 엔진(Kyverno)을 기본 탑재합니다.
  - title: 관리형 ↔ 자체운영 토글
    desc: DB/Cache/Kafka/MQ 는 클라우드 관리형과 Operator 기반 자체운영을 변수 하나로 전환할 수 있게 설계합니다.

flow:
  title: "주문하기(Place Order) 클릭 이후 무슨 일이 일어나는가"
  steps:
    - { num: 1, layer: Edge, text: "사용자가 앱/브라우저에서 주문 → DNS 조회 → CDN/WAF 를 거쳐 HTTPS(TLS 1.3)로 진입", color: "#94a3b8" }
    - { num: 2, layer: Load Balancer, text: "L4 로드밸런서(NLB/MetalLB)가 Gateway Pod 로 TCP 커넥션을 분산", color: "#a78bfa" }
    - { num: 3, layer: API Gateway, text: "Envoy Gateway 가 JWT 검증(AUTH) → Rate Limit → 경로 기반 ROUTING (/api/orders → order)", color: "#22c55e" }
    - { num: 4, layer: Service Mesh, text: "ztunnel 이 서비스 간 트래픽을 자동 mTLS 로 암호화, AuthorizationPolicy 로 호출 권한 검증", color: "#38bdf8" }
    - { num: 5, layer: Order, text: "Order 서비스가 Catalog(가격/재고 조회, Valkey 캐시 우선) 확인 후 주문 레코드를 자기 DB 에 저장", color: "#f59e0b" }
    - { num: 6, layer: Payment, text: "Order → Payment 동기 호출, Payment 는 Egress 허용된 외부 PG(Stripe 등) API 로 결제 승인", color: "#ec4899" }
    - { num: 7, layer: Kafka, text: "결제 완료 시 order.events 토픽에 OrderPlaced 이벤트 발행 (Outbox 패턴 권장)", color: "#facc15" }
    - { num: 8, layer: Consumers, text: "Inventory(재고 차감), Shipping(배송 생성), Notification Worker 가 각자 이벤트를 구독해 비동기 처리", color: "#3b82f6" }
    - { num: 9, layer: RabbitMQ, text: "Notification Worker 가 이메일 작업을 RabbitMQ Quorum Queue 에 적재 → Email Worker 가 재시도 보장하며 발송", color: "#fb923c" }
    - { num: 10, layer: Observability, text: "모든 구간의 Metric/Log/Trace 가 OpenTelemetry 로 수집되어 Grafana 에서 하나의 TraceID 로 추적", color: "#2dd4bf" }

environments:
  columns: [구성요소, "Legacy / On-Premise", "Private Cloud (OpenStack·VMware)", AWS, Azure, GCP]
  rows:
    - [Edge(DNS·CDN·WAF), "GSLB · L7 WAF 어플라이언스 · 사내 DNS", "외부 CDN + 사내 WAF", "Route 53 · CloudFront · AWS WAF", "Azure DNS · Front Door · WAF", "Cloud DNS · Cloud CDN · Cloud Armor"]
    - [Load Balancer, "L4 스위치 / HAProxy+Keepalived · MetalLB", "Octavia(OpenStack) · NSX ALB · MetalLB", "NLB (AWS LB Controller)", "Azure Load Balancer", "Cloud Load Balancing (NEG)"]
    - [API Gateway, "Envoy Gateway (Gateway API)", "Envoy Gateway (Gateway API)", "Envoy Gateway ※대안: API Gateway(관리형)", "Envoy Gateway ※대안: APIM", "Envoy Gateway ※대안: GKE Gateway / Apigee"]
    - [Kubernetes, "kubeadm · RKE2 · OpenShift", "Kubespray · Rancher · Tanzu", "EKS (+Karpenter)", "AKS (+NAP)", "GKE (Autopilot/Standard)"]
    - [Service Mesh, "Istio ambient", "Istio ambient", "Istio ambient", "Istio ambient (AKS add-on 가능)", "Istio ambient / Cloud Service Mesh"]
    - [Database, "PostgreSQL + CloudNativePG", "CloudNativePG", "Aurora PostgreSQL / RDS", "Azure DB for PostgreSQL", "Cloud SQL / AlloyDB"]
    - [Cache, "Valkey (Helm)", "Valkey (Helm)", "ElastiCache for Valkey", "Azure Managed Redis", "Memorystore for Valkey"]
    - [Event Streaming, "Kafka (Strimzi)", "Kafka (Strimzi)", "Amazon MSK / Strimzi", "Event Hubs (Kafka API) / Strimzi", "Managed Service for Apache Kafka / Strimzi"]
    - [Message Queue, "RabbitMQ (Cluster Operator)", "RabbitMQ (Cluster Operator)", "Amazon MQ for RabbitMQ", "Service Bus / RabbitMQ Operator", "Pub/Sub / RabbitMQ Operator"]
    - [Monitoring, "Prometheus · Grafana · OTel", "Prometheus · Grafana · OTel", "AMP · AMG 또는 자체 스택", "Azure Monitor (Prometheus)", "Managed Prometheus"]
    - [Logging, "Loki · Alloy (or OpenSearch)", "Loki · Alloy", "Loki(S3) · CloudWatch", "Loki · Log Analytics", "Loki(GCS) · Cloud Logging"]
    - [CI/CD, "GitLab CI/Jenkins + Argo CD", "GitLab CI + Argo CD", "GitHub Actions + Argo CD", "GitHub Actions/Azure DevOps + Argo CD", "Cloud Build/GitHub Actions + Argo CD"]
    - [Registry, "Harbor", "Harbor", "Amazon ECR", "Azure Container Registry", "Artifact Registry"]
    - [Secrets & Config, "OpenBao(Vault) + ESO", "OpenBao + ESO", "Secrets Manager + ESO", "Key Vault + ESO", "Secret Manager + ESO"]
    - [Policy & Security, "Kyverno · Falco · Trivy", "Kyverno · Falco · Trivy", "Kyverno · GuardDuty EKS · Inspector", "Kyverno · Defender for Containers", "Kyverno · Security Command Center"]

roadmap:
  - phase: "Phase 0. 기반 준비"
    items: ["Git 저장소/브랜치 전략", "Terraform state 백엔드(S3 + use_lockfile)", "도메인·인증서·IAM 관리자 계정", "버전 기준표 확정 (부록 참고)"]
  - phase: "Phase 1. 네트워크 & 클러스터"
    items: ["VPC 3-Tier 서브넷 (01-vpc.tf)", "EKS/kubeadm 클러스터 (02-eks.tf / 20-kubeadm-cluster.yml)", "노드 오토스케일링 Karpenter (03-karpenter.tf)", "L4 로드밸런서 컨트롤러/MetalLB"]
  - phase: "Phase 2. 트래픽 & 보안 기반"
    items: ["Envoy Gateway + Gateway/HTTPRoute", "cert-manager + ClusterIssuer", "Istio ambient + mTLS STRICT", "External Secrets + 시크릿 저장소", "Kyverno 정책(Audit 모드)"]
  - phase: "Phase 3. 관측성"
    items: ["kube-prometheus-stack", "Loki + Alloy", "OpenTelemetry Operator + Collector + 자동계측", "Kiali · Grafana 대시보드 · 알람 룰"]
  - phase: "Phase 4. 데이터 계층"
    items: ["PostgreSQL (Aurora 또는 CNPG)", "Valkey 캐시", "Kafka (MSK 또는 Strimzi)", "RabbitMQ (Amazon MQ 또는 Operator)"]
  - phase: "Phase 5. 애플리케이션 & 배포 파이프라인"
    items: ["ECR/Harbor 리포지토리", "GitHub Actions 빌드 → 이미지 서명/스캔", "Argo CD App of Apps", "공통 microservice 차트로 6개 서비스 배포"]
  - phase: "Phase 6. 운영 전환"
    items: ["차트 버전 고정", "Kyverno Enforce 전환", "부하/장애 테스트(Chaos)", "백업·DR 리허설", "운영 이관 문서화"]

versions:
  note: "2026-11 기준 웹 검증 결과. 운영 적용 시 각 프로젝트 릴리스 노트에서 패치 버전을 재확인하십시오."
  rows:
    - [Kubernetes (upstream), "v1.37 (2026-08-26 릴리스)", "EKS 는 1.36 기본 / 1.37 지원 확인 후 상향"]
    - [Amazon EKS, "1.36 (2026-06 지원 시작)", "1.34 표준지원 2026-12 종료 → 신규는 1.35+ 권장"]
    - [Gateway API, "v1.4 GA", "ingress-nginx 는 2026-03 은퇴 → 신규 도입 금지"]
    - [Envoy Gateway, "v1.9.x", "분기별 릴리스, 마이너 6개월 지원"]
    - [Istio, "1.31 (ambient)", "1.31 부터 차트 저장소가 blob.istio.io / ghcr.io 로 변경"]
    - [Argo CD, "3.5.x / 3.4.x 지원 중", "3.3 은 2026-11 지원 종료"]
    - [Kafka, "4.x (KRaft 전용)", "ZooKeeper 완전 제거, Strimzi 1.x 는 v1 CRD 만 지원"]
    - [OpenTofu, "1.12.x (CNCF Sandbox)", "Terraform 1.10+ 과 병행 사용 가능하도록 코드 작성"]
    - [Grafana Alloy, "현행", "Promtail 은 2026-03-02 EOL"]
    - [terraform-aws-modules/eks, "~> 21.x", "AWS Provider 6.x 필요, cluster_ 접두어 제거"]

