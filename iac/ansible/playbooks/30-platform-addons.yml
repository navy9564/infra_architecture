---
# [4단계] 플랫폼 애드온 설치 (Helm) - helm/values/*.yaml 을 그대로 사용
#   전체:      ansible-playbook playbooks/30-platform-addons.yml
#   일부만:    ansible-playbook playbooks/30-platform-addons.yml -e '{"addon_only":["envoy-gateway"]}'
- name: Install platform addons via Helm
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    selected: "{{ platform_addons | selectattr('name', 'in', addon_only) | list if addon_only is defined else platform_addons }}"
  tasks:
    - name: Install helm binary (공식 설치 스크립트)
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install python kubernetes client (kubernetes.core 의존성)
      ansible.builtin.package:
        name: "{{ 'python3-kubernetes' if ansible_os_family == 'Debian' else 'python3-pip' }}"
        state: present

    - name: Copy values files to node
      ansible.builtin.copy:
        src: "{{ helm_values_dir }}/"
        dest: /opt/platform/values/
        mode: "0644"

    - name: Add HTTP helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.repo }}"
      loop: "{{ selected | rejectattr('repo', 'match', '^oci://') | list }}"

    - name: Install / upgrade releases
      kubernetes.core.helm:
        name: "{{ item.name }}"
        release_namespace: "{{ item.ns }}"
        create_namespace: true
        chart_ref: "{{ (item.repo ~ '/' ~ item.chart) if item.repo is match('^oci://') else (item.name ~ '/' ~ item.chart) }}"
        chart_version: "{{ chart_versions[item.name] | default(omit) }}"
        values_files: "{{ ['/opt/platform/values/' ~ item['values']] if item['values'] else [] }}"
        wait: true
        wait_timeout: 15m
        atomic: true
      loop: "{{ selected }}"
      loop_control:
        label: "{{ item.name }}"
