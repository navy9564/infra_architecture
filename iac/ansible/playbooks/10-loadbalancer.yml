---
# [2단계] kube-apiserver HA : HAProxy + Keepalived (VIP)
#   On-Prem 의 "LOAD BALANCER" 계층 - 서비스 트래픽용 L4 는 MetalLB 가 담당
- name: Configure API load balancer
  hosts: lb
  become: true
  tasks:
    - name: Install haproxy & keepalived
      ansible.builtin.package:
        name: [haproxy, keepalived]
        state: present

    - name: HAProxy config
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
        content: |
          global
            log /dev/log local0
            maxconn 20000
          defaults
            mode tcp
            timeout connect 5s
            timeout client 1h
            timeout server 1h
          frontend k8s-api
            bind *:{{ api_port }}
            default_backend k8s-api
          backend k8s-api
            option tcp-check
            balance roundrobin
          {% for h in groups['control_plane'] %}
            server {{ h }} {{ hostvars[h].ansible_host }}:6443 check fall 3 rise 2
          {% endfor %}
      notify: Restart haproxy

    - name: Keepalived config
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
        content: |
          vrrp_script chk_haproxy {
            script "/usr/bin/pgrep haproxy"
            interval 2
          }
          vrrp_instance K8S_API {
            state {{ 'MASTER' if keepalived_priority | int == 150 else 'BACKUP' }}
            interface {{ api_vip_interface }}
            virtual_router_id 51
            priority {{ keepalived_priority }}
            advert_int 1
            virtual_ipaddress {
              {{ api_vip }}
            }
            track_script {
              chk_haproxy
            }
          }
      notify: Restart keepalived

    - name: Allow binding non-local VIP
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        reload: true

    - name: Enable services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [haproxy, keepalived]

  handlers:
    - name: Restart haproxy
      ansible.builtin.service:
        name: haproxy
        state: restarted
    - name: Restart keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
